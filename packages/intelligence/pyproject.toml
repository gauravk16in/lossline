[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "lossline-intelligence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.11.7",
    "lightgbm==4.6.0",
    "numpy==2.2.3",
    "scipy==1.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
