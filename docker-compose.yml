services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - lossline-postgres:/var/lib/postgresql/data

  redis:
    image: redis:8.2.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL:?set DIRECT_DATABASE_URL in .env}
      REDIS_URL: redis://redis:6379/0
      INGEST_API_KEY: ${INGEST_API_KEY:?set INGEST_API_KEY in .env}
      MANAGER_API_KEY: ${MANAGER_API_KEY:?set MANAGER_API_KEY in .env}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY in .env}
      ALLOW_GLOBAL_DEMO_RESET: ${ALLOW_GLOBAL_DEMO_RESET:-false}
      DEMO_MODE: "true"
      DEBUG: "false"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports: ["8000:8000"]

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_MANAGER_API_KEY: ${MANAGER_API_KEY:?set MANAGER_API_KEY in .env}
    depends_on:
      backend: { condition: service_healthy }
    ports: ["3000:80"]

  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    profiles: ["demo"]
    environment:
      LOSSLINE_API_URL: http://backend:8000
      LOSSLINE_INGEST_KEY: ${INGEST_API_KEY:?set INGEST_API_KEY in .env}
      LOSSLINE_MANAGER_KEY: ${MANAGER_API_KEY:?set MANAGER_API_KEY in .env}
      LOSSLINE_ADMIN_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY in .env}
    depends_on:
      backend: { condition: service_healthy }

volumes:
  lossline-postgres:
