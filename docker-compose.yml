version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: lossline-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  redisinsight:
    image: redis/redisinsight:latest
    container_name: lossline-redisinsight
    ports:
      - "8001:5540"
    depends_on:
      - redis
    restart: always

volumes:
  redis_data:
